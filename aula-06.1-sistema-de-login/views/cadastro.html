{% extends 'base.html'%}
{% block content %}

{% with messages = get_flashed_messages{with_categories=true} %}
{% for category, message in messages}
    <div class="alert alert-{{category}}">

        {{message}}

    </div>
    {% endfor %}
    {% endwith %}

<div class="container col-4">
    <div class="card mt-4">
        <div class="card-header">
            <h2> cadastro usuario</h2>
        </div>
        <div class="card-body m-auto">
            <form action="{{url_for('cadastro')}}" method="POST">
                <label>e-mail</label>
                <input type="email" name="email" class="from-control"
                placeholder="insira seu email" required>
                  <label>senha</label>
                <input type="password" name="senha" class="from-control"
                placeholder="insira sua senha" required>
                  <label>e-mail</label>
                <button type="submit"class="btn btn-danger btn-block">cadastrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock content%}
